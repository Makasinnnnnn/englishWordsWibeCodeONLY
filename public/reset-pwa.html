<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сброс PWA</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(30rem, calc(100vw - 2rem));
        border: 1px solid rgb(15 23 42 / 0.1);
        border-radius: 0.75rem;
        background: white;
        box-shadow: 0 20px 60px rgb(15 23 42 / 0.12);
        padding: 1.5rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.4rem;
      }

      p {
        color: #475569;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        border-radius: 0.6rem;
        background: #0284c7;
        color: white;
        font-weight: 700;
        padding: 0 1rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Сбрасываем кэш приложения</h1>
      <p id="status">Удаляем старый service worker и локальные кэши...</p>
      <a href="/login">Открыть вход</a>
    </main>
    <script>
      async function resetPwa() {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }

          document.getElementById("status").textContent = "Готово. Сейчас откроется свежая страница входа.";
          window.setTimeout(() => window.location.replace("/login"), 800);
        } catch {
          document.getElementById("status").textContent =
            "Не удалось сбросить автоматически. Удалите приложение и откройте сайт заново.";
        }
      }

      resetPwa();
    </script>
  </body>
</html>
