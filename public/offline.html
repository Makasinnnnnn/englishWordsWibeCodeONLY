<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Memory Trainer offline</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #090b10;
        color: #eef2ff;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(28rem, calc(100vw - 2rem));
        border: 1px solid rgb(255 255 255 / 0.1);
        border-radius: 0.75rem;
        background: rgb(21 26 34 / 0.92);
        padding: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 1.4rem;
      }

      p {
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения</h1>
      <p>Word Memory Trainer не может загрузить страницу без интернета. Проверьте соединение и попробуйте снова.</p>
    </main>
  </body>
</html>
